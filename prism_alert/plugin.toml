[plugin]
name = "prism_alert"
icon_path = "assets/logo.svg"
label = "Prism alerts"
version = "0.1.0"
description = "Notifies you, in the app and by email, when a number crosses a line you set; checked with your own access."
long_description = """
An alert watches one reading of a Prism number chart and tells its owner when it goes above or below a limit, or
rises or falls by more than a percentage. Each check runs as the person who made the alert, so it sees exactly
what they see in Prism and nothing more. Written in Rust.
See docs/design.md in this plugin (prism_alert/docs/design.md).
"""
authors = [{ name = "Aether", email = "hello@aether.local" }]
dependencies = ["prism"]
capabilities = ["db::query", "db::mutate", "plugins::call", "scheduler::enqueue", "scheduler::run_as", "notify::send", "communication::send"]
access_models = [
  { name = "prism_alert", permissions = ["read", "write"] },
]
is_builtin = false
wasm_file = "out/plugin.wasm"

[app]
label = "Alerts"
icon = "bell"
route = "/prism/alerts"
description = "Be told when a number crosses a line."

[plugin.api]
version = "0.1"

[plugin.meta]
kind = "addon"
workspace = "prism"
